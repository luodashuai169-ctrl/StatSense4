<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatSenseI - 让数据更智能</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #4cc9f0;
            --neon-blue: #00d9ff;
            --neon-purple: #9d4edd;
            --light-color: #f8f9fa;
            --dark-color: #0d1117;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --gray-color: #8b949e;
            --light-gray: #21262d;
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;
            --glow: 0 0 10px rgba(76, 201, 240, 0.7);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: var(--dark-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(76, 201, 240, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(157, 78, 221, 0.05) 0%, transparent 20%),
                linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: var(--light-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* 粒子背景容器 */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        /* 科技感背景动画 */
        .tech-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .tech-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(transparent 65%, rgba(76, 201, 240, 0.03) 75%, transparent 85%),
                linear-gradient(90deg, transparent 65%, rgba(157, 78, 221, 0.03) 75%, transparent 85%);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            opacity: 0.3;
        }
        
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }
        
        .floating-element {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background-color: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue);
            animation: float 15s infinite linear;
        }
        
        .floating-element:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .floating-element:nth-child(2) {
            top: 60%;
            left: 85%;
            animation-delay: 3s;
            background-color: var(--neon-purple);
            box-shadow: 0 0 8px var(--neon-purple);
        }
        
        .floating-element:nth-child(3) {
            top: 80%;
            left: 15%;
            animation-delay: 6s;
        }
        
        .floating-element:nth-child(4) {
            top: 30%;
            left: 90%;
            animation-delay: 9s;
            background-color: var(--neon-purple);
            box-shadow: 0 0 8px var(--neon-purple);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-20px) translateX(10px); }
            50% { transform: translateY(10px) translateX(-10px); }
            75% { transform: translateY(-10px) translateX(-5px); }
        }
        
        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* 头部样式 */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
            position: relative;
        }
        
        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 15px 30px;
            background: rgba(67, 97, 238, 0.1);
            border-radius: 50px;
            border: 1px solid rgba(76, 201, 240, 0.2);
            box-shadow: var(--glow);
            position: relative;
            overflow: hidden;
        }
        
        .logo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(76, 201, 240, 0.2), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-img {
            width: 50px;  /* 设置宽度 */
            height: 50px; /* 设置高度 */
            object-fit: contain; /* 确保图片比例不失真 */
            filter: drop-shadow(0 0 5px rgba(76, 201, 240, 0.5)); /* 给图片加点科技感发光 */
        }
        
        .logo-icon {
            color: var(--accent-color);
            font-size: 2.5rem;
            filter: drop-shadow(0 0 5px rgba(76, 201, 240, 0.7));
        }
        
        h1 {
            font-size: 3.5rem;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            line-height: 1.2;
            text-shadow: 0 0 15px rgba(76, 201, 240, 0.3);
            position: relative;
            display: inline-block;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }
        
        h2 {
            font-size: 1.8rem;
            color: var(--gray-color);
            font-weight: 400;
            max-width: 800px;
            margin: 30px auto;
            line-height: 1.5;
        }
        
        /* 图标区域样式 */
        .subtitle-icons {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            opacity: 0;
            transform: translateY(30px) scale(0.8);
        }
        
        .icon-item.animate-in {
            animation: iconJumpIn 0.6s ease-out forwards;
        }
        
        @keyframes iconJumpIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.8);
            }
            50% {
                transform: translateY(-10px) scale(1.05);
            }
            70% {
                transform: translateY(5px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .icon-item:hover {
            transform: translateY(-5px);
        }
        
        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(67, 97, 238, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--neon-blue);
            border: 1px solid rgba(76, 201, 240, 0.3);
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.2);
            transition: var(--transition);
        }
        
        .icon-item:hover .icon-circle {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(76, 201, 240, 0.4);
            border-color: var(--neon-blue);
            animation: iconPulse 1.5s infinite;
        }
        
        @keyframes iconPulse {
            0%, 100% {
                box-shadow: 0 0 15px rgba(76, 201, 240, 0.2);
            }
            50% {
                box-shadow: 0 0 25px rgba(76, 201, 240, 0.6);
            }
        }
        
        .icon-text {
            font-size: 1rem;
            color: var(--gray-color);
            font-weight: 500;
        }
        
        /* 信息强化模块 - 居中显示 */
        .highlight-box {
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.2), rgba(157, 78, 221, 0.2));
            color: white;
            border-radius: var(--border-radius);
            padding: 30px 35px;
            margin: 40px auto 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(76, 201, 240, 0.2);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        
        .highlight-box.animate-in {
            animation: highlightReveal 1.2s ease-out forwards;
        }
        
        @keyframes highlightReveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            20% {
                opacity: 0.7;
                transform: translateY(-10px) scale(1.02);
            }
            40% {
                transform: translateY(5px) scale(0.98);
            }
            60% {
                transform: translateY(-3px) scale(1.01);
            }
            80% {
                transform: translateY(2px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .highlight-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .highlight-content {
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        
        .highlight-icon {
            font-size: 3.2rem;
            color: var(--neon-blue);
            filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.7));
            animation: iconGlow 2s infinite alternate;
        }
        
        @keyframes iconGlow {
            0% {
                filter: drop-shadow(0 0 5px rgba(0, 217, 255, 0.5));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.9));
                transform: scale(1.05);
            }
        }
        
        .highlight-text {
            font-size: 1.6rem;
            font-weight: 600;
        }
        
        .highlight-amount {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd166;
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
            animation: amountPulse 2s infinite alternate;
        }
        
        @keyframes amountPulse {
            0% {
                text-shadow: 0 0 5px rgba(255, 209, 102, 0.5);
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 15px rgba(255, 209, 102, 0.9);
                transform: scale(1.05);
            }
        }
        
        /* 价格方案容器 - 一行四个 */
        .pricing-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 80px;
        }
        
        .pricing-card {
            background: rgba(22, 27, 34, 0.8);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(76, 201, 240, 0.1);
            backdrop-filter: blur(10px);
            height: 100%;
            opacity: 0;
            transform: translateY(30px);
        }
        
        .pricing-card.animate-in {
            animation: cardSlideUp 0.8s ease-out forwards;
        }
        
        @keyframes cardSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .pricing-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), var(--glow);
            border-color: rgba(76, 201, 240, 0.3);
        }
        
        /* 卡片头部 */
        .card-header {
            padding: 25px 20px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(76, 201, 240, 0.1);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .period {
            font-size: 1.1rem;
            color: var(--gray-color);
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .period i {
            color: var(--accent-color);
        }
        
        .plan-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .price {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--neon-blue);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        /* 视觉权重指示器 */
        .weight-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .star {
            color: #ffc107;
            font-size: 1.2rem;
            text-shadow: 0 0 5px rgba(255, 193, 7, 0.5);
        }
        
        /* 价值主张 */
        .value-prop {
            background: linear-gradient(90deg, rgba(67, 97, 238, 0.15), rgba(76, 201, 240, 0.15));
            padding: 12px 15px;
            border-radius: 8px;
            margin: 15px 20px;
            text-align: center;
            font-weight: 600;
            color: var(--neon-blue);
            border-left: 4px solid var(--accent-color);
            position: relative;
            overflow: hidden;
        }
        
        .value-prop::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--neon-blue), var(--neon-purple));
        }
        
        /* 特色标签 */
        .featured-tag {
            position: absolute;
            top: 0;
            right: 0;
            background: linear-gradient(90deg, #ff9d00, #ff5e00);
            color: white;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 0.9rem;
            border-bottom-left-radius: 20px;
            z-index: 2;
            box-shadow: 0 0 15px rgba(255, 94, 0, 0.5);
        }
        
        /* 年度旗舰版特殊样式 - 现在在最右侧 */
        .pricing-card.featured {
            border: 2px solid var(--accent-color);
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 25px rgba(76, 201, 240, 0.4);
        }
        
        .pricing-card.featured .card-header {
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.1), rgba(76, 201, 240, 0.1));
        }
        
        .pricing-card.featured:hover {
            transform: scale(1.05) translateY(-15px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(76, 201, 240, 0.6);
        }
        
        /* 按钮样式 */
        .cta-button {
            display: block;
            width: calc(100% - 40px);
            margin: 0 20px 25px;
            padding: 15px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }
        
        .cta-button:hover::before {
            left: 100%;
        }
        
        .cta-button:hover {
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.4);
        }
        
        .cta-button.featured {
            background: linear-gradient(90deg, #ff9d00, #ff5e00);
        }
        
        .cta-button.featured:hover {
            background: linear-gradient(90deg, #ff5e00, #ff5e00);
            box-shadow: 0 10px 20px rgba(255, 94, 0, 0.4);
        }
        
        /* 页脚 */
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(76, 201, 240, 0.1);
            color: var(--gray-color);
            font-size: 0.9rem;
            position: relative;
            width: 100%;
            max-width: 1200px;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: var(--gray-color);
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .footer-links a:hover {
            color: var(--neon-blue);
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .pricing-container {
                grid-template-columns: repeat(2, 1fr);
                max-width: 800px;
                margin: 0 auto 60px;
            }
            
            .pricing-card.featured {
                transform: none;
            }
            
            .pricing-card.featured:hover {
                transform: translateY(-15px);
            }
            
            .subtitle-icons {
                gap: 30px;
            }
            
            .highlight-box {
                max-width: 90%;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            h2 {
                font-size: 1.4rem;
            }
            
            .pricing-container {
                grid-template-columns: 1fr;
                max-width: 400px;
            }
            
            .subtitle-icons {
                gap: 20px;
            }
            
            .icon-circle {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
            }
            
            .highlight-text {
                font-size: 1.3rem;
            }
            
            .highlight-amount {
                font-size: 1.8rem;
            }
            
            .logo {
                font-size: 1.6rem;
            }
            
            .logo-icon {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            h2 {
                font-size: 1.1rem;
            }
            
            .highlight-box {
                padding: 20px;
            }
            
            .price {
                font-size: 2.2rem;
            }
            
            .plan-name {
                font-size: 1.5rem;
            }
            
            .subtitle-icons {
                gap: 15px;
            }
            
            .icon-circle {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
            }
            
            .icon-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- 粒子背景容器 -->
    <div id="particles-js"></div>
    
    <!-- 科技感背景元素 -->
    <div class="tech-bg">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo">
                    <img src="2027.ico" alt="Logo" class="logo-img">
                    <span>StatSense</span>
                </div>
            </div>
            <h1>让数据更智能</h1>
            <!-- 添加图标区域 -->
            <div class="subtitle-icons">
                <div class="icon-item">
                    <div class="icon-circle"><i class="fas fa-clock"></i></div>
                    <div class="icon-text">节省时间</div>
                </div>
                <div class="icon-item">
                    <div class="icon-circle"><i class="fas fa-chart-bar"></i></div>
                    <div class="icon-text">精准分析</div>
                </div>
                <div class="icon-item">
                    <div class="icon-circle"><i class="fas fa-bolt"></i></div>
                    <div class="icon-text">快速决策</div>
                </div>
                <div class="icon-item">
                    <div class="icon-circle"><i class="fas fa-shield-alt"></i></div>
                    <div class="icon-text">安全可靠</div>
                </div>
            </div>
        </header>
        
        <!-- 信息强化模块 - 居中显示 -->
        <div class="highlight-box">
            <div class="highlight-content">
                <i class="fas fa-gem highlight-icon"></i>
                <div>
                    <div class="highlight-text">选择年度旗舰版 = 节省 <span class="highlight-amount">¥900</span>（相当于免费使用2个月）</div>
                    <div style="font-size: 1.1rem; opacity: 0.9; margin-top: 8px;">💰 年度旗舰版最优惠，立即节省更多！</div>
                </div>
            </div>
        </div>
        
        <!-- 价格方案容器 -->
        <div class="pricing-container">
            <!-- 1个月：灵活体验版 -->
            <div class="pricing-card">
                <div class="card-header">
                    <div class="period">
                        <i class="fas fa-calendar-day"></i> 1个月
                    </div>
                    <div class="weight-indicator">
                        <i class="fas fa-star star"></i>

    <!-- 引入粒子库 -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
        // 粒子背景初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化粒子背景
            particlesJS('particles-js', {
                particles: {
                    number: {
                        value: 80,
                        density: {
                            enable: true,
                            value_area: 800
                        }
                    },
                    color: {
                        value: ["#00d9ff", "#9d4edd", "#4cc9f0", "#4361ee"]
                    },
                    shape: {
                        type: "circle",
                        stroke: {
                            width: 0,
                            color: "#000000"
                        }
                    },
                    opacity: {
                        value: 0.6,
                        random: true,
                        anim: {
                            enable: true,
                            speed: 1,
                            opacity_min: 0.3,
                            sync: false
                        }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: {
                            enable: true,
                            speed: 2,
                            size_min: 0.5,
                            sync: false
                        }
                    },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#4cc9f0",
                        opacity: 0.2,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 1.5,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false,
                        attract: {
                            enable: false,
                            rotateX: 600,
                            rotateY: 1200
                        }
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: {
                            enable: true,
                            mode: "grab"
                        },
                        onclick: {
                            enable: true,
                            mode: "push"
                        },
                        resize: true
                    },
                    modes: {
                        grab: {
                            distance: 140,
                            line_linked: {
                                opacity: 0.5
                            }
                        },
                        bubble: {
                            distance: 400,
                            size: 40,
                            duration: 2,
                            opacity: 8,
                            speed: 3
                        },
                        repulse: {
                            distance: 200,
                            duration: 0.4
                        },
                        push: {
                            particles_nb: 4
                        },
                        remove: {
                            particles_nb: 2
                        }
                    }
                },
                retina_detect: true
            });
            
            // 图标逐个跳入动画
            const iconItems = document.querySelectorAll('.icon-item');
            iconItems.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('animate-in');
                }, 300 + (index * 200));
            });
            
            // highlight-box动画
            const highlightBox = document.querySelector('.highlight-box');
            setTimeout(() => {
                highlightBox.classList.add('animate-in');
            }, 300 + (iconItems.length * 200) + 300);
            
            // 价格卡片动画
            const pricingCards = document.querySelectorAll('.pricing-card');
            setTimeout(() => {
                pricingCards.forEach((card, index) => {
                    setTimeout(() => {
                        card.classList.add('animate-in');
                    }, index * 150);
                });
            }, 300 + (iconItems.length * 200) + 800);
            
            // 为所有价格方案卡片添加点击效果
            document.querySelectorAll('.pricing-card').forEach(card => {
                card.addEventListener('click', function() {
                    // 获取方案名称
                    const planName = this.querySelector('.plan-name').textContent;
                    const planPrice = this.querySelector('.price').textContent;
                    
                    // 模拟选择操作
                    console.log(`选择了方案: ${planName}, 价格: ${planPrice}`);
                    
                    // 添加视觉反馈
                    this.style.transform = this.classList.contains('featured') 
                        ? 'scale(1.05) translateY(-5px)' 
                        : 'translateY(-5px)';
                    
                    // 在实际应用中，这里可以添加跳转到购买页面的逻辑
                });
            });
            
            // 为按钮添加点击效果
            document.querySelectorAll('.cta-button').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const card = this.closest('.pricing-card');
                    const planName = card.querySelector('.plan-name').textContent;
                    const planPrice = card.querySelector('.price').textContent;
                    
                    // 创建脉冲效果
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                    
                    // 显示选择提示
                    alert(`您已选择 ${planName} 方案，价格: ${planPrice}\n\n即将跳转到支付页面...`);
                    
                    // 在实际应用中，这里会跳转到支付页面
                });
            });
            
            // 为图标添加悬停效果
            document.querySelectorAll('.icon-item').forEach(item => {
                item.addEventListener('mouseenter', function() {
                    const icon = this.querySelector('.icon-circle i');
                    icon.style.transform = 'rotate(15deg) scale(1.1)';
                    setTimeout(() => {
                        icon.style.transform = '';
                    }, 300);
                });
            });
        });
    </script>
